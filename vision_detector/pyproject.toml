[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-detector"
version = "0.1.0"
description = "Contract types for the DokoDetector vision boundary"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
