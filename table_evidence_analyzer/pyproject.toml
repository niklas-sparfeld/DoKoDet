[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "table-evidence-analyzer"
version = "0.1.0"
description = "Contract types for the DokoDetector table-evidence boundary"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Pillow>=11,<13",
  "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
]
training = [
  "rfdetr[train,augment]==1.9.4",
  "safetensors==0.8.0",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "transformers==5.16.1",
]
inference = [
  "rfdetr==1.9.4",
  "safetensors==0.8.0",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "transformers==5.16.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
table-analyzer = "table_evidence_analyzer.cli:main"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
