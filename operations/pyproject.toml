[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doko-operations"
version = "0.1.0"
description = "DokoDetector repository data and model operations"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Pillow==12.3.0",
  "doko-game-engine",
  # Match OpenCV's FFmpeg 7 dylibs on macOS. PyAV 18 loads duplicate AVFoundation classes.
  "av==15.1.0",
  "opencv-python>=4.10",
  "pyyaml>=6.0,<7",
  "rfdetr==1.9.4",
  "table-evidence-analyzer",
]

[tool.uv.sources]
doko-game-engine = { path = "../game_engine" }
table-evidence-analyzer = { path = "../table_evidence_analyzer", editable = true }

[project.scripts]
doko = "doko_operations.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
]
training = [
  "rfdetr[train,augment]==1.9.4",
  "safetensors==0.8.0",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "transformers==5.16.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
