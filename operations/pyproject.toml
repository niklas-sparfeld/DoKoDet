[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doko-operations"
version = "0.1.0"
description = "DokoDetector repository data and model operations"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pyyaml>=6.0,<7",
  "table-evidence-analyzer",
]

[tool.uv.sources]
table-evidence-analyzer = { path = "../table_evidence_analyzer" }

[project.scripts]
doko = "doko_operations.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
